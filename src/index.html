<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
</head>

<body>
    <header>
        <nav class="menu">
            <button>Todos</button>
            <button>completos</button>
            <button>Hoy</button>
            <p>listas</p>
            <ul id="list-content">
            </ul>
            <button id="añadir">añadir</button>
        </nav>
    </header>
    <section id="container">
        <div>
            <div id="section-form-folder" class="hidden">
                <form id="form-folder">
                    <h2>ingresa el nombre de la lista:</h2>
                    <input type="text" name="name" placeholder="New List">
                    <button type="submit" id="create-folder">Crear</button>
                </form>
            </div>
            <div id="section-form-task" class="hidden" data-complete="false">
                <form id="form-task">
                    <h2>ingresa la informacion de la tarea:</h2>
                    <input type="text" name="title" placeholder="title">
                    <input type="text" name="description" placeholder="description">
                    <input type="date" name="dueDate" placeholder="date">
                    <label for="priority">prioridad:</label>
                    <select id="priority" name="priority">
                        <option value="baja">baja</option>
                        <option value="media">media</option>
                        <option value="alta">alta</option>
                    </select>
                    <button type="submit" id="create-task">Crear</button>
                </form>
            </div>
        </div>
        <div id="container-page"></div>
    </section>
</body>

</html>
